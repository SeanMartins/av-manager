<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<title>Scheda cespite · MMG</title>
<script>
// Stessa scelta di tema dell'app (Profilo → Tema), se salvata su questo dispositivo
try{const t=localStorage.getItem('mmg-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<style>
  @font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20C0,U+2C60-2C7F,U+A720-A7FF}
  /* Stessi token di AV Manager (index.html) */
  :root{
    --font-sans:'Inter Variable','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --color-bg:#F7F5F2;--color-surface:#FFFFFF;--color-surface-sunken:#F0EDE8;--color-border:#E4DFD7;
    --color-text:#1C1A17;--color-text-secondary:#5E574E;
    --color-accent:#272A71;--color-accent-text:#272A71;--color-accent-subtle:#E7E8F3;
    --color-success:#2F6A3E;--color-success-subtle:#E3EEE5;
    --color-warning:#8A5300;--color-warning-subtle:#F6EBD9;
    --color-danger:#B3261E;--color-danger-subtle:#F6E4E1;
    --radius-md:8px;--radius-lg:12px;--radius-full:999px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --color-bg:#151412;--color-surface:#1D1C19;--color-surface-sunken:#100F0E;--color-border:#262420;
    --color-text:#F3F0EB;--color-text-secondary:#B8B0A4;
    --color-accent:#5A5FC0;--color-accent-text:#9CA0E8;--color-accent-subtle:#1D1E35;
    --color-success:#7FBF8E;--color-success-subtle:#17241B;
    --color-warning:#E0A651;--color-warning-subtle:#2A2013;
    --color-danger:#F08A80;--color-danger-subtle:#2A1714;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --color-bg:#151412;--color-surface:#1D1C19;--color-surface-sunken:#100F0E;--color-border:#262420;
      --color-text:#F3F0EB;--color-text-secondary:#B8B0A4;
      --color-accent:#5A5FC0;--color-accent-text:#9CA0E8;--color-accent-subtle:#1D1E35;
      --color-success:#7FBF8E;--color-success-subtle:#17241B;
      --color-warning:#E0A651;--color-warning-subtle:#2A2013;
      --color-danger:#F08A80;--color-danger-subtle:#2A1714;
      color-scheme:dark;
    }
    :root:not([data-theme="light"]) .brand img{content:url('logo-dark.png')}
  }
  :root[data-theme="dark"] .brand img{content:url('logo-dark.png')}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  .header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:14px 16px}
  .brand{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .brand img{height:28px;width:auto}
  .header-text h1{font-size:15px;font-weight:600}
  .header-text p{font-size:12px;color:var(--color-text-secondary)}
  .container{max-width:600px;margin:0 auto;padding:20px 16px}
  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px}
  .card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary);margin-bottom:12px}
  .asset-name{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2;margin-bottom:4px;overflow-wrap:anywhere}
  .asset-marca{font-size:15px;color:var(--color-text-secondary)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:500}
  .badge-green{background:var(--color-success-subtle);color:var(--color-success)}
  .badge-blue{background:var(--color-accent-subtle);color:var(--color-accent-text)}
  .badge-amber{background:var(--color-warning-subtle);color:var(--color-warning)}
  .badge-neutral{background:var(--color-surface-sunken);color:var(--color-text-secondary);border:1px solid var(--color-border)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-border)}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .row-label{font-size:13px;color:var(--color-text-secondary);flex-shrink:0}
  .row-value{font-size:14px;font-weight:500;text-align:right;overflow-wrap:anywhere}
  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--color-border)}
  .tl-item{position:relative;margin-bottom:16px}
  .tl-item:last-child{margin-bottom:0}
  .tl-dot{position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--color-surface)}
  .tl-dot-green{background:var(--color-success)}
  .tl-dot-amber{background:var(--color-warning)}
  .tl-dot-blue{background:var(--color-accent)}
  .tl-date{font-size:12px;color:var(--color-text-secondary)}
  .tl-title{font-size:14px;font-weight:600}
  .tl-sub{font-size:13px;color:var(--color-text-secondary);margin-top:2px;overflow-wrap:anywhere}
  .tl-sub strong{color:var(--color-text);font-weight:600}
  .delta{font-weight:600;color:var(--color-text);font-variant-numeric:tabular-nums}
  .loading{text-align:center;padding:60px 20px;color:var(--color-text-secondary)}
  .loading .spinner{width:28px;height:28px;border:3px solid var(--color-border);border-top-color:var(--color-accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  .error-card{background:var(--color-danger-subtle);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:24px;text-align:center;margin:20px 0}
  .error-card h2{color:var(--color-danger);font-size:17px;font-weight:600;margin-bottom:6px}
  .error-card p{color:var(--color-text-secondary);font-size:14px}
  .footer{text-align:center;padding:24px 16px;font-size:12px;color:var(--color-text-secondary)}
  .footer a{color:inherit}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.loading .spinner{animation-duration:2.4s}}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <img src="logo.png" alt="MMG" width="84" height="28">
    <div class="header-text">
      <h1>Scheda cespite</h1>
      <p>Multimedia Meeting Group s.n.c.</p>
    </div>
  </div>
</header>

<main class="container">
  <div id="loadingState" class="loading" role="status">
    <div class="spinner"></div>
    <div>Caricamento della scheda…</div>
  </div>
  <div id="mainContent" style="display:none"></div>
  <div id="errorState" style="display:none" class="error-card" role="alert">
    <h2>Cespite non trovato</h2>
    <p id="errorMsg">Il QR code potrebbe essere danneggiato o il record è stato eliminato.</p>
  </div>
</main>

<div class="footer" id="footerInfo" style="display:none">
  MMG Multimedia Meeting Group s.n.c. · Via Frusa, 49 · 50131 Firenze<br>
  Tel: 055/582929 · info@mm-group.it · www.mm-group.it
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB = {
  apiKey:"AIzaSyDxxvnjtKdybQStd0yUT8xKE0MBgwYPZTo",
  authDomain:"av-manager-41c40.firebaseapp.com",
  projectId:"av-manager-41c40",
  storageBucket:"av-manager-41c40.firebasestorage.app",
  messagingSenderId:"1047072296195",
  appId:"1:1047072296195:web:d220ed9c196b185d016d36"
};

const app = initializeApp(FB);
const db  = getFirestore(app);

const CAT_LABEL = {
  audio:'Audio',video:'Video',ledwall:'LED wall',luci:'Luci',traduzione:'Traduzione',
  strutture:'Strutture',informatica:'Informatica',altro:'Altro'
};
// I campi sono testo libero inserito nell'app: vanno escapati prima di finire nell'HTML
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtData(iso){
  if(!iso)return '—';
  return new Date(iso).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
}
function fmtEuro(n){
  if(!n&&n!==0)return '—';
  return '€ '+parseFloat(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
}

async function load(){
  const params = new URLSearchParams(location.search);
  const col = params.get('col');
  const id  = params.get('id');

  if(!col||!id){showError('Parametri mancanti nel QR code.');return;}

  try{
    const snap = await getDoc(doc(db, col, id));
    if(!snap.exists()){showError('Record non trovato nel database.');return;}
    const d = snap.data();
    render(col, d);
  }catch(e){
    showError('Errore di connessione: '+e.message);
  }
}

function render(col, d){
  const tipo = col==='ces_nuovi'?'nuovi': col==='ces_venduti'?'venduti':'install';

  // Badge tipo
  const tipoBadge = {
    nuovi:  '<span class="badge badge-green">Acquisto</span>',
    venduti:'<span class="badge badge-amber">Venduto</span>',
    install:'<span class="badge badge-blue">Installato</span>'
  }[tipo];

  const catLabel = esc(CAT_LABEL[d.cat]||d.cat||'');

  // Timeline eventi
  let timeline = '';

  // Acquisto
  if(d.dataAcq||d.prezzoAcq){
    timeline += `
      <div class="tl-item">
        <div class="tl-dot tl-dot-green"></div>
        <div class="tl-date">${fmtData(d.dataAcq)}</div>
        <div class="tl-title">Acquisto</div>
        ${d.fornitore?`<div class="tl-sub">Fornitore: ${esc(d.fornitore)}</div>`:''}
        ${d.prezzoAcq?`<div class="tl-sub">Prezzo: <strong>${fmtEuro(d.prezzoAcq)}</strong></div>`:''}
      </div>`;
  }

  // Vendita
  if(tipo==='venduti'&&(d.dataVend||d.prezzoVend)){
    const acq=parseFloat(d.prezzoAcq)||0;
    const vend=parseFloat(d.prezzoVend)||0;
    const delta=vend-acq;
    const deltaHtml=acq&&vend?`<span class="delta">(${delta>=0?'+':'−'}${fmtEuro(Math.abs(delta))} sul costo)</span>`:'';
    timeline += `
      <div class="tl-item">
        <div class="tl-dot tl-dot-amber"></div>
        <div class="tl-date">${fmtData(d.dataVend)}</div>
        <div class="tl-title">Vendita</div>
        ${d.acquirente?`<div class="tl-sub">Venduto a: <strong>${esc(d.acquirente)}</strong></div>`:''}
        ${d.prezzoVend?`<div class="tl-sub">Prezzo: <strong>${fmtEuro(d.prezzoVend)}</strong> ${deltaHtml}</div>`:''}
      </div>`;
  }

  // Installazione
  if(tipo==='install'&&(d.dataInst||d.cliente)){
    timeline += `
      <div class="tl-item">
        <div class="tl-dot tl-dot-blue"></div>
        <div class="tl-date">${fmtData(d.dataInst)}</div>
        <div class="tl-title">Installazione</div>
        ${d.cliente?`<div class="tl-sub">Presso: <strong>${esc(d.cliente)}</strong></div>`:''}
        ${d.ubicazione?`<div class="tl-sub">Ubicazione: ${esc(d.ubicazione)}</div>`:''}
        ${d.lavoro?`<div class="tl-sub">Lavoro: ${esc(d.lavoro)}</div>`:''}
      </div>`;
  }

  // Dettagli tecnici
  const dettagli = [
    d.marca       && {label:'Marca / Modello', value:esc(d.marca)},
    d.seriale     && {label:'Numero seriale',  value:esc(d.seriale)},
    catLabel      && {label:'Categoria',        value:catLabel},
    d.qty>1       && {label:'Quantità',         value:esc(d.qty)},
    d.note        && {label:'Note',             value:esc(d.note)},
    d.creatoDa    && {label:'Registrato da',    value:esc(d.creatoDa)},
  ].filter(Boolean);

  const html = `
    <div class="card">
      <div class="badges">${tipoBadge}${catLabel?`<span class="badge badge-neutral">${catLabel}</span>`:''}</div>
      <h2 class="asset-name">${esc(d.nome||'—')}</h2>
      ${d.marca?`<div class="asset-marca">${esc(d.marca)}</div>`:''}
    </div>

    ${timeline?`
    <div class="card">
      <h3 class="card-title">Storia del bene</h3>
      <div class="timeline">${timeline}</div>
    </div>`:''}

    ${dettagli.length?`
    <div class="card">
      <h3 class="card-title">Dettagli tecnici</h3>
      ${dettagli.map(r=>`
        <div class="row">
          <span class="row-label">${r.label}</span>
          <span class="row-value">${r.value}</span>
        </div>`).join('')}
    </div>`:''}
  `;

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').innerHTML = html;
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('footerInfo').style.display = 'block';
  document.title = (d.nome||'Cespite') + ' — MMG';
}

function showError(msg){
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorState').style.display = 'block';
}

load();
</script>
</body>
</html>
